/**:
  ros__parameters:
    control_hz: 1000

    # Franka Robot (fr3) のジョイント名
    joint_names_order:
      - "fr3_joint1"
      - "fr3_joint2"
      - "fr3_joint3"
      - "fr3_joint4"
      - "fr3_joint5"
      - "fr3_joint6"
      - "fr3_joint7"

    # 各ジョイントの最大速度 [rad/s]
    joint_max_vel:
      - 2.62
      - 2.62
      - 2.62
      - 2.62
      - 5.26
      - 4.18
      - 5.26

    # 各ジョイントの可動域（下限） [rad]
    joint_pos_limits_lower:
      - -2.7437
      - -1.7837
      - -2.9007
      - -3.0421
      - -2.8065
      - 0.5445
      - -3.0159  
    # 各ジョイントの可動域（上限） [rad]
    joint_pos_limits_upper:
      -  2.7437
      -  1.7837
      -  2.9007
      - -0.1518
      -  2.8065
      -  4.5169
      -  3.0159

    # --- 以下のパラメータはご自身の環境に合わせて確認・修正してください ---
    move_group_name: "fr3_manipulator" # MoveItのプランニンググループ名 (例: panda_manipulator)
    robot_base_frame: "base"        # ロボットのベースフレーム名 (例: fr3_link0)
    ee_link: "pestle_tip"            # エンドエフェクタのフレーム名 (例: fr3_hand_tcp)
    feedback_wrench_sensor_frame: "leptrino_frame" # 力覚センサのフレーム名 (例: force_torque_sensor)
    # command topic
    joint_trajectory_controller_command_topic: "/fr3_arm_controller/joint_trajectory"
    cartesian_motion_controller_command_topic: "/cartesian_motion_controller/target_frame"
    cartesian_compliance_controller_command_topic: "/cartesian_compliance_controller/target_frame"
    # onolab_ros2 の cartesian_impedance_controller は「<controller名>/reference_pose」を読む
    cartesian_impedance_controller_command_topic: "/cartesian_impedance_controller/reference_pose"
    # sensor topic  
    feedback_wrench_topic: "/leptrino/wrench/filtered"
    feedback_wrench_zero_service: "/leptrino/wrench/filtered/zero_ftsensor"
    # robot description
    joint_states_topic: "/joint_states"
    robot_description_name: "/robot_description"

    # 指令ガード（robots/pose_command_guard.py）。すべての指令は controller に送る前にこの上限で制限する。
    # 値の出どころ: 暫定の推測値（2026-10-24、模擬HWでのみ確認。実機では未確認）。
    # 追従誤差の上限は onolab_ros2 の joy_cartesian_teleop（FR3）と同じ 20 mm / 0.1 rad にした
    max_linear_speed_m_per_s: 0.1
    max_angular_speed_rad_per_s: 0.5
    max_tracking_error_m: 0.02
    max_tracking_error_rad: 0.1
    joint_state_timeout_ms: 100.0
    max_command_interval_s: 0.02


    robot_home_pose_with_touch:
      - 0.44
      - 0.44
      - 0.10
      - 0.0
      - 1.0
      - 0.0
      - 0.0

    robot_start_pose_with_touch:
      - 0.44
      - 0.44
      - 0.10
      - 0.0
      - 1.0
      - 0.0
      - 0.0
